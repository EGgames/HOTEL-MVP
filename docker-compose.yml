version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hotel_booking_db
    environment:
      POSTGRES_USER: ${DB_USER:-hotel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel_pass}
      POSTGRES_DB: ${DB_NAME:-hotel_booking}
    ports:
      - '${DB_PORT:-5440}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-hotel_user} -d ${DB_NAME:-hotel_booking}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_booking_api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hotel_user}
      DB_PASSWORD: ${DB_PASSWORD:-hotel_pass}
      DB_NAME: ${DB_NAME:-hotel_booking}
      HOLD_DURATION_MINUTES: 10
      PAYMENT_SIMULATOR_DECLINE_RATE: 0.2
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel_booking_frontend
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
