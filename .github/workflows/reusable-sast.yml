# ─────────────────────────────────────────────────────────────────────────────
# Reusable — SAST con CodeQL
#
# Analiza TypeScript (backend) y JavaScript (frontend) buscando vulnerabilidades
# de seguridad usando las queries "security-and-quality" de CodeQL.
# Los resultados aparecen en GitHub → Security → Code scanning alerts.
#
# Documentación: https://docs.github.com/en/code-security/code-scanning
# ─────────────────────────────────────────────────────────────────────────────

name: Reusable — SAST (CodeQL)

on:
  workflow_call:

permissions:
  actions: read           # requerido por CodeQL en repos privados
  contents: read
  security-events: write  # subir SARIF al Security tab

jobs:
  codeql:
    name: CodeQL — javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inicializa CodeQL con el lenguaje javascript-typescript.
      # Cubre tanto archivos .ts (backend NestJS) como .js/.jsx (frontend React).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-and-quality incluye:
          # - CWE Top 25 vulnerabilities
          # - OWASP Top 10
          # - Quality issues (dead code, injection risks, etc.)
          queries: security-and-quality

      # Auto-build: para JS/TS no requiere compilación; CodeQL analiza las fuentes.
      - name: Auto-build
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Sube el SARIF al Security tab para revisión centralizada
          upload: true
