name: CI — Shift Left

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]
  merge_group:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo de la ejecución manual (opcional)"
        required: false
        default: "Ejecución manual"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: "[ Gate 0 ] Secret Scan"
    uses: ./.github/workflows/reusable-secrets-scan.yml
    permissions:
      contents: read
      pull-requests: write

  lint-backend:
    name: "[ Gate 1a ] Lint — Backend (TypeScript)"
    needs: secret-scan
    uses: ./.github/workflows/reusable-lint.yml
    permissions:
      contents: read
    with:
      working-directory: backend
      node-version: "20"
      lint-command: >-
        npx eslint "{src,apps,libs,test}/**/*.ts"
        --max-warnings 0
        --format stylish

  lint-frontend:
    name: "[ Gate 1b ] Lint — Frontend (React)"
    needs: secret-scan
    uses: ./.github/workflows/reusable-lint.yml
    permissions:
      contents: read
    with:
      working-directory: frontend
      node-version: "20"
      lint-command: >-
        npx eslint src --ext .js,.jsx
        --max-warnings 0
        --format stylish

  sast:
    name: "[ Gate 1c ] SAST — CodeQL (JS / TS)"
    needs: secret-scan
    uses: ./.github/workflows/reusable-sast.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  dependency-scan:
    name: "[ Gate 1d ] Dependency Scan — npm audit"
    needs: secret-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci --prefer-offline

      - name: npm audit — production deps (high & critical)
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit — dev deps (info only, non-blocking)
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high || true

  test-backend:
    name: "[ Gate 2a ] Tests — Backend (Jest)"
    needs: [lint-backend, sast]
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    with:
      working-directory: backend
      node-version: "20"
      test-command: "npx jest --coverage --ci --forceExit"
      coverage-artifact: coverage-backend

  test-frontend:
    name: "[ Gate 2b ] Tests — Frontend (Vitest)"
    needs: [lint-frontend, sast]
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    with:
      working-directory: frontend
      node-version: "20"
      test-command: "npm run test:cov"
      coverage-artifact: coverage-frontend

  build:
    name: "[ Gate 3 ] Build — Docker Images"
    needs: [test-backend, test-frontend, dependency-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image — ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: hotel-mvp-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quality-gate:
    name: "Quality Gate"
    if: always()
    needs:
      - secret-scan
      - lint-backend
      - lint-frontend
      - sast
      - dependency-scan
      - test-backend
      - test-frontend
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        id: gate
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          LINT_BE:     ${{ needs.lint-backend.result }}
          LINT_FE:     ${{ needs.lint-frontend.result }}
          SAST:        ${{ needs.sast.result }}
          DEP_SCAN:    ${{ needs.dependency-scan.result }}
          TEST_BE:     ${{ needs.test-backend.result }}
          TEST_FE:     ${{ needs.test-frontend.result }}
          BUILD:       ${{ needs.build.result }}
        run: |
          echo "=================================================="
          echo "   SHIFT LEFT — QUALITY GATE RESULTS"
          echo "=================================================="
          printf "  %-35s %s\n"  "Secret Scan:"         "$SECRET_SCAN"
          printf "  %-35s %s\n"  "Lint Backend:"        "$LINT_BE"
          printf "  %-35s %s\n"  "Lint Frontend:"       "$LINT_FE"
          printf "  %-35s %s\n"  "SAST (CodeQL):"       "$SAST"
          printf "  %-35s %s\n"  "Dependency Scan:"     "$DEP_SCAN"
          printf "  %-35s %s\n"  "Tests Backend:"       "$TEST_BE"
          printf "  %-35s %s\n"  "Tests Frontend:"      "$TEST_FE"
          printf "  %-35s %s\n"  "Docker Build:"        "$BUILD"
          echo "=================================================="

          check_job() {
            local name="$1" result="$2"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
              FAILED_JOBS="${FAILED_JOBS}${name}, "
            fi
          }

          FAILED=false
          FAILED_JOBS=""
          check_job "Secret Scan"    "$SECRET_SCAN"
          check_job "Lint Backend"   "$LINT_BE"
          check_job "Lint Frontend"  "$LINT_FE"
          check_job "SAST"           "$SAST"
          check_job "Dep Scan"       "$DEP_SCAN"
          check_job "Tests Backend"  "$TEST_BE"
          check_job "Tests Frontend" "$TEST_FE"
          check_job "Docker Build"   "$BUILD"

          if [[ "$FAILED" == "true" ]]; then
            echo "status=failed"                  >> "$GITHUB_OUTPUT"
            echo "failed_jobs=${FAILED_JOBS%, }" >> "$GITHUB_OUTPUT"
            echo ""
            echo "QUALITY GATE FAILED — Jobs fallidos: ${FAILED_JOBS%, }"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "failed_jobs="  >> "$GITHUB_OUTPUT"
            echo ""
            echo "QUALITY GATE PASSED — Safe to merge."
          fi

      - name: Post PR comment — failed
        if: always() && github.event_name == 'pull_request' && steps.gate.outputs.status == 'failed'
        uses: actions/github-script@v7
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          LINT_BE:     ${{ needs.lint-backend.result }}
          LINT_FE:     ${{ needs.lint-frontend.result }}
          SAST:        ${{ needs.sast.result }}
          DEP_SCAN:    ${{ needs.dependency-scan.result }}
          TEST_BE:     ${{ needs.test-backend.result }}
          TEST_FE:     ${{ needs.test-frontend.result }}
          BUILD:       ${{ needs.build.result }}
          FAILED_JOBS: ${{ steps.gate.outputs.failed_jobs }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const sha  = context.sha.slice(0, 7);
            const url  = context.payload.pull_request.html_url;
            const body = [
              '## ❌ Quality Gate — FAILED',
              '',
              `**Merge bloqueado.** Jobs fallidos: \`${process.env.FAILED_JOBS}\``,
              '',
              '| Job | Estado |',
              '|-----|--------|',
              `| Secret Scan     | ${icon(process.env.SECRET_SCAN)} ${process.env.SECRET_SCAN} |`,
              `| Lint Backend    | ${icon(process.env.LINT_BE)} ${process.env.LINT_BE} |`,
              `| Lint Frontend   | ${icon(process.env.LINT_FE)} ${process.env.LINT_FE} |`,
              `| SAST (CodeQL)   | ${icon(process.env.SAST)} ${process.env.SAST} |`,
              `| Dependency Scan | ${icon(process.env.DEP_SCAN)} ${process.env.DEP_SCAN} |`,
              `| Tests Backend   | ${icon(process.env.TEST_BE)} ${process.env.TEST_BE} |`,
              `| Tests Frontend  | ${icon(process.env.TEST_FE)} ${process.env.TEST_FE} |`,
              `| Docker Build    | ${icon(process.env.BUILD)} ${process.env.BUILD} |`,
              '',
              `> Corrige los errores y haz push nuevamente. [Ver logs](${url}/checks) · commit \`${sha}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('Quality Gate')
            );
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Post PR comment — passed
        if: always() && github.event_name == 'pull_request' && steps.gate.outputs.status == 'passed'
        uses: actions/github-script@v7
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          LINT_BE:     ${{ needs.lint-backend.result }}
          LINT_FE:     ${{ needs.lint-frontend.result }}
          SAST:        ${{ needs.sast.result }}
          DEP_SCAN:    ${{ needs.dependency-scan.result }}
          TEST_BE:     ${{ needs.test-backend.result }}
          TEST_FE:     ${{ needs.test-frontend.result }}
          BUILD:       ${{ needs.build.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const sha  = context.sha.slice(0, 7);
            const url  = context.payload.pull_request.html_url;
            const body = [
              '## ✅ Quality Gate — PASSED',
              '',
              '**Este PR está listo para hacer merge.** Todos los checks pasaron correctamente.',
              '',
              '| Job | Estado |',
              '|-----|--------|',
              `| Secret Scan     | ${icon(process.env.SECRET_SCAN)} ${process.env.SECRET_SCAN} |`,
              `| Lint Backend    | ${icon(process.env.LINT_BE)} ${process.env.LINT_BE} |`,
              `| Lint Frontend   | ${icon(process.env.LINT_FE)} ${process.env.LINT_FE} |`,
              `| SAST (CodeQL)   | ${icon(process.env.SAST)} ${process.env.SAST} |`,
              `| Dependency Scan | ${icon(process.env.DEP_SCAN)} ${process.env.DEP_SCAN} |`,
              `| Tests Backend   | ${icon(process.env.TEST_BE)} ${process.env.TEST_BE} |`,
              `| Tests Frontend  | ${icon(process.env.TEST_FE)} ${process.env.TEST_FE} |`,
              `| Docker Build    | ${icon(process.env.BUILD)} ${process.env.BUILD} |`,
              '',
              `> [Ver logs](${url}/checks) · commit \`${sha}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('Quality Gate')
            );
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Enforce gate
        if: always() && steps.gate.outputs.status == 'failed'
        run: |
          echo "QUALITY GATE FAILED — Merge bloqueado."
          echo "Revisa los jobs anteriores para ver el detalle del error."
          exit 1
