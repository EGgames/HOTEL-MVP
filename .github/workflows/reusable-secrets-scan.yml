# ─────────────────────────────────────────────────────────────────────────────
# Reusable — Secret Scan con Gitleaks
#
# Detecta credenciales, API keys, tokens y contraseñas hardcodeadas en el
# código antes de que lleguen a main o dev.
#
# En PRs: escanea solo los cambios del PR (diff base..head).
# En push: escanea todos los commits del push.
#
# Cuando se detecta un secreto, el job falla y bloquea el Quality Gate.
# Los secrets detectados se redactan en los logs para no exponerlos.
#
# Documentación: https://github.com/gitleaks/gitleaks
# ─────────────────────────────────────────────────────────────────────────────

name: Reusable — Secret Scan (Gitleaks)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write  # para comentar en PRs cuando se detectan secrets

jobs:
  gitleaks:
    name: Gitleaks — Detect Hardcoded Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # fetch-depth 0: historia completa para detectar secretos en commits anteriores
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE requerido solo en repos privados de organizaciones.
          # Para repos públicos o cuentas personales no es necesario.
          # Configúralo como secret en: Settings → Secrets → GITLEAKS_LICENSE
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # Si Gitleaks detecta un secreto, este step falla automáticamente.
        # El Quality Gate captura este fallo y bloquea el merge.

      - name: Notify on detection
        if: failure()
        run: |
          echo "::error::Gitleaks detectó secretos expuestos en el código."
          echo "::error::Revisa el reporte de Gitleaks y rota las credenciales comprometidas."
          echo "::error::Usa variables de entorno o GitHub Secrets para almacenar valores sensibles."
          echo ""
          echo "Recursos:"
          echo "  - GitHub Secrets: https://docs.github.com/en/actions/security-guides/encrypted-secrets"
          echo "  - .gitignore para archivos .env: https://git-scm.com/docs/gitignore"
